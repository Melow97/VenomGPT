<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee2cf">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>VENOM GPT — Your Local AI. Your Rules.</title>
<style>
html,body{margin:0;min-height:100%;background:#eee2cf}body{overflow-x:hidden}#venom-boot-loader{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;background:#eee2cf;color:#171513;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .28s ease,visibility .28s ease}#venom-boot-loader.done{opacity:0;visibility:hidden;pointer-events:none}.vbl{text-align:center}.vbl-spider{font-size:48px;line-height:1;display:block;filter:drop-shadow(0 5px 12px #b92b1c28);animation:vblPulse 1.8s ease-in-out infinite}.vbl-name{margin-top:13px;font-weight:900;letter-spacing:-.5px;font-size:20px}.vbl-name b{color:#d63b25}.vbl-status{margin-top:7px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#766657}.vbl-line{width:90px;height:2px;margin:15px auto 0;border-radius:99px;background:linear-gradient(90deg,transparent,#d63b25,transparent);animation:vblScan 1.2s ease-in-out infinite}@keyframes vblPulse{50%{transform:translateY(-3px) scale(1.05)}}@keyframes vblScan{50%{opacity:.35;transform:scaleX(.55)}}
</style>
</head>
<body>
<div id="venom-boot-loader" aria-label="Loading Venom GPT"><div class="vbl"><span class="vbl-spider">🕷️</span><div class="vbl-name">VENOM <b>GPT</b></div><div class="vbl-status">Waking the Spider Network</div><div class="vbl-line"></div></div></div>
<div id="landing"></div><div id="auth" style="display:none"></div><div id="app" style="display:none"></div>
<script>
(()=>{
 const finish=()=>document.getElementById('venom-boot-loader')?.classList.add('done');
 const sup=document.createElement('script');sup.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sup.async=true;sup.onload=()=>window.dispatchEvent(new Event('venom:supabase-ready'));sup.onerror=()=>console.warn('[VENOM] Supabase CDN unavailable; Home remains available');document.head.appendChild(sup);
 const boot=document.createElement('script');boot.src='/production-boot.js?v=20260816-95';boot.async=true;boot.onload=()=>window.dispatchEvent(new Event('venom:boot-ready'));boot.onerror=()=>{console.error('[VENOM] production boot failed');finish()};document.head.appendChild(boot);
 window.addEventListener('load',finish,{once:true});setTimeout(finish,2400);setTimeout(()=>{if(!document.getElementById('landing')?.innerHTML&&!document.getElementById('app')?.innerHTML){console.error('[VENOM] render timeout');finish()}},3200);
 window.addEventListener('error',e=>console.error('[VENOM]',e.error||e.message));window.addEventListener('unhandledrejection',e=>console.error('[VENOM]',e.reason));
})();
</script>
</body>
</html>
